<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ذكريات - يونس</title>
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #ffe4ec 0%, #ffc0cb 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .memories-container { max-width: 550px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 2.2rem; background: linear-gradient(135deg, #e84393, #fd79a8); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
        .header p { color: #b34180; font-size: 1rem; margin-top: 8px; }
        .gallery { display: flex; flex-direction: column; gap: 25px; }
        .photo-card {
            background: rgba(255, 245, 250, 0.95);
            border-radius: 48px;
            padding: 18px;
            box-shadow: 0 12px 25px rgba(255, 105, 180, 0.2);
            transition: transform 0.3s ease;
            animation: fadeInUp 0.6s ease backwards;
        }
        .photo-card:hover { transform: translateY(-5px); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .photo-card:nth-child(1) { animation-delay: 0.1s; }
        .photo-card:nth-child(2) { animation-delay: 0.2s; }
        .photo-card:nth-child(3) { animation-delay: 0.3s; }
        .photo-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #c44569;
            margin-bottom: 12px;
            text-align: center;
            background: #ffeef4;
            border-radius: 40px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 5px 20px;
        }
        .photo-wrapper {
            background: #ffeef4;
            border-radius: 36px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffb7c5;
        }
        .photo-wrapper:active { transform: scale(0.98); }
        .photo-placeholder {
            width: 100%;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 30px 20px;
            color: #b98092;
            text-align: center;
        }
        .photo-placeholder span { font-size: 3.5rem; opacity: 0.6; }
        .gallery-img { width: 100%; height: auto; display: block; object-fit: cover; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }
        .modal-img { max-width: 90%; max-height: 80%; border-radius: 20px; box-shadow: 0 0 30px rgba(255,255,255,0.3); animation: zoomIn 0.3s ease; }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px auto 20px;
            width: 80%;
        }
        .custom-btn {
            background: #f78fb3;
            border: none;
            padding: 14px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #b34180;
            text-align: center;
            transition: 0.2s;
            width: 100%;
        }
        .custom-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b34180;
        }
        .suggest-btn {
            background: #e84393;
            box-shadow: 0 5px 0 #a12a6b;
        }
        @media (max-width: 550px) {
            .photo-card { padding: 12px; }
            .photo-title { font-size: 1.1rem; }
            .photo-placeholder { min-height: 180px; padding: 20px; }
            .photo-placeholder span { font-size: 2.5rem; }
            .buttons-container { width: 90%; }
            .custom-btn { font-size: 1rem; padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div class="memories-container">
    <div class="header">
        <h1>📸 ذكرياتنا</h1>
        <p>✨ اضغط على أي صورة لتكبيرها ✨</p>
    </div>

    <div class="gallery" id="gallery">
        <!-- الكارد 1: يونس الصغير -->
        <div class="photo-card">
            <div class="photo-title">👶 يونس الصغير</div>
            <div class="photo-wrapper">
                <img class="gallery-img" src="يونس%20الصغير.jpg" alt="يونس الصغير">
            </div>
        </div>

<!-- الكارد 2: نحن معا -->
<div class="photo-card">
    <div class="photo-title">💑 نحن معًا</div>
    <div class="photo-wrapper">
        <img class="gallery-img" src="نحن_معا.jpg" alt="نحن معا">
    </div>
</div>
        <!-- الكارد 3: يونس -->
        <div class="photo-card">
            <div class="photo-title">⭐ يونس</div>
            <div class="photo-wrapper">
                <img class="gallery-img" src="يونس.jpg" alt="يونس">
            </div>
        </div>
    </div>

    <div class="buttons-container">
        <button class="custom-btn" id="backBtn">🔙 رجوع للرئيسية</button>
        <button class="custom-btn suggest-btn" id="suggestBtn">💡 اقتراحاتي لك</button>
    </div>
</div>

<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-img" id="modalImage" src="" alt="صورة مكبرة">
</div>

<script>
    let currentModal = document.getElementById('imageModal');
    let modalImg = document.getElementById('modalImage');
    let closeModal = document.querySelector('.close-modal');

    function openModal(imgSrc) {
        if (imgSrc) {
            modalImg.src = imgSrc;
            currentModal.style.display = 'flex';
        }
    }

    closeModal.onclick = function() { currentModal.style.display = 'none'; }
    currentModal.onclick = function(e) { if (e.target === currentModal) currentModal.style.display = 'none'; }

    function enableZoomOnImages() {
        document.querySelectorAll('.photo-wrapper img').forEach(img => {
            img.style.cursor = 'pointer';
            img.onclick = (e) => {
                e.stopPropagation();
                openModal(img.src);
            };
        });
    }

    const observer = new MutationObserver(function() { enableZoomOnImages(); });
    observer.observe(document.getElementById('gallery'), { childList: true, subtree: true });
    window.addEventListener('load', () => { enableZoomOnImages(); });
    
    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = "index.html"; });
    document.getElementById('suggestBtn').addEventListener('click', () => { window.location.href = "suggestions.html"; });
</script>
</body>
</html>

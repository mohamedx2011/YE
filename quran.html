<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>طريق الهداية - القرآن</title>
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #0a2f1f 0%, #064e3b 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: "﴿﴾";
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 5rem;
            opacity: 0.05;
            color: gold;
            font-family: serif;
            pointer-events: none;
        }

        body::after {
            content: "۞";
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 4rem;
            opacity: 0.05;
            color: gold;
            pointer-events: none;
        }

        .quran-container {
            max-width: 550px;
            width: 100%;
            margin: 20px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: #fbbf24;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 8px 25px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .header p {
            color: #d1d5db;
            font-size: 1rem;
            margin-top: 12px;
        }

        .bismillah {
            text-align: center;
            font-size: 1.6rem;
            color: #fbbf24;
            margin-bottom: 20px;
            font-family: 'Amiri', serif;
            letter-spacing: 2px;
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .quran-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 20px 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-right: 8px solid #fbbf24;
            animation: fadeInUp 0.5s ease backwards;
        }

        .quran-card:hover {
            transform: translateX(-5px);
            background: white;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .quran-card:active {
            transform: scale(0.98);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #065f46;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .back-btn {
            background: #fbbf24;
            border: none;
            padding: 14px 28px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 60px;
            color: #064e3b;
            cursor: pointer;
            margin: 35px auto 20px;
            box-shadow: 0 5px 0 #b45309;
            display: block;
            width: 80%;
            text-align: center;
            transition: 0.2s;
        }

        .back-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b45309;
        }

        @media (max-width: 550px) {
            .quran-card { padding: 15px 14px; }
            .card-title { font-size: 1.1rem; }
            .card-icon { font-size: 2rem; }
            .header h1 { font-size: 1.5rem; }
            .bismillah { font-size: 1.2rem; }
        }

        .sparkle-gold {
            position: fixed;
            background: #fbbf24;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            opacity: 0.7;
            pointer-events: none;
            animation: twinkle 1s infinite alternate;
            z-index: 999;
        }

        @keyframes twinkle {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(2); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="quran-container">
    <div class="header">
        <h1>🕌 طريق الهداية</h1>
        <p>✨ ربي اشرح لي صدري ويسر لي أمري ✨</p>
    </div>
    <div class="bismillah">
        ﷽
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- سورة الفاتحة -->
        <div class="quran-card" data-link="https://youtube.com/shorts/akafI4Jt7LM?si=ZSs4sqNRhBkDbkc-">
            <div class="card-icon">📖✨</div>
            <div class="card-title">سورة الفاتحة</div>
            <div class="card-desc">أم الكتاب - القارئ سعد الغامدي</div>
        </div>

        <!-- سورة النصر -->
        <div class="quran-card" data-link="https://www.youtube.com/watch?v=cdSfD6OYkuw">
            <div class="card-icon">🌅📖</div>
            <div class="card-title">سورة النصر</div>
            <div class="card-desc">إذا جاء نصر الله والفتح</div>
        </div>

        <!-- سورة الإخلاص -->
        <div class="quran-card" data-link="https://www.youtube.com/watch?v=nYggou5D0oo">
            <div class="card-icon">🤍📖</div>
            <div class="card-title">سورة الإخلاص</div>
            <div class="card-desc">قل هو الله أحد</div>
        </div>

        <!-- آية الكرسي -->
        <div class="quran-card" data-link="https://www.youtube.com/watch?v=w7ldgkVob3k">
            <div class="card-icon">🪑✨</div>
            <div class="card-title">آية الكرسي</div>
            <div class="card-desc">سورة البقرة - آية الكرسي</div>
        </div>

        <!-- سورة الشعراء (من الدقيقة 14:52) -->
        <div class="quran-card" data-link="https://youtu.be/39wyD9kYMlc?si=wvQQMrYq8VJS7i9u&t=892">
            <div class="card-icon">📜🕊️</div>
            <div class="card-title">سورة الشعراء</div>
            <div class="card-desc">من الآية ١٩٢ - القارئ سعد الغامدي</div>
        </div>
    </div>

    <button class="back-btn" id="backBtn">🔙 رجوع للاقتراحات</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
<script>
    function launchIslamicConfetti() {
        confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 }, colors: ['#fbbf24', '#10b981', '#f59e0b', '#065f46'] });
        setTimeout(() => confetti({ particleCount: 70, spread: 100, origin: { y: 0.5 }, colors: ['#fbbf24', '#10b981'] }), 150);
        setTimeout(() => confetti({ particleCount: 80, spread: 70, origin: { y: 0.7, x: 0.3 }, colors: ['#f59e0b'] }), 300);
    }

    function createGoldSparkles() {
        for (let i = 0; i < 50; i++) {
            let spark = document.createElement('div');
            spark.classList.add('sparkle-gold');
            spark.style.left = Math.random() * window.innerWidth + 'px';
            spark.style.top = Math.random() * window.innerHeight + 'px';
            spark.style.width = (Math.random() * 6 + 2) + 'px';
            spark.style.height = spark.style.width;
            document.body.appendChild(spark);
            setTimeout(() => { if (spark && spark.remove) spark.remove(); }, 3500);
        }
    }

    window.addEventListener('load', () => {
        launchIslamicConfetti();
        createGoldSparkles();
    });

    // إضافة حدث الضغط على كل بطاقة لفتح الرابط
    document.querySelectorAll('.quran-card').forEach(card => {
        card.addEventListener('click', () => {
            const link = card.getAttribute('data-link');
            if (link) {
                // تأثير احتفالي خفيف عند الضغط
                launchIslamicConfetti();
                createGoldSparkles();
                // فتح الرابط في تبويب جديد بعد نصف ثانية
                setTimeout(() => {
                    window.open(link, '_blank');
                }, 200);
            }
        });
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = "suggestions.html";
    });
</script>
</body>
</html>

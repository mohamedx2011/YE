<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>عيد ميلاد يونس - وردي</title>
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #ffe4ec 0%, #ffc0cb 100%);
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 245, 250, 0.96);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            box-shadow: 0 20px 35px rgba(255, 105, 180, 0.3), 0 0 0 6px #ffb7c5;
            max-width: 500px;
            width: 100%;
            margin: 20px auto;
            padding: 24px 20px 35px;
            text-align: center;
        }

        .balloon {
            font-size: 3.8rem;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 5px 8px #ff99aa);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e84393, #fd79a8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 12px 0 5px;
        }

        .name {
            font-size: 2.4rem;
            font-weight: 800;
            color: #b34180;
            background: #ffeef4;
            display: inline-block;
            padding: 0 28px;
            border-radius: 60px;
            margin: 10px 0;
            box-shadow: 0 4px 8px #ffb7c5;
        }

        .counter-box {
            background: #ffe0eb;
            border-radius: 60px;
            padding: 15px 12px;
            margin: 18px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .counter-item {
            background: #ffffffcc;
            border-radius: 40px;
            padding: 8px 12px;
            min-width: 70px;
            text-align: center;
            box-shadow: 0 0 0 2px #ff90b0;
        }

        .counter-number {
            font-size: 1.7rem;
            font-weight: 900;
            font-family: monospace;
            color: #d63384;
            line-height: 1.2;
        }

        .counter-label {
            font-size: 0.7rem;
            color: #b34180;
            font-weight: bold;
        }

        .emoji-row {
            font-size: 2.2rem;
            letter-spacing: 12px;
            margin: 15px 0;
        }

        .btn-pink {
            background: #f78fb3;
            border: none;
            padding: 14px 28px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin: 15px 0 10px;
            box-shadow: 0 6px 0 #b34180;
            width: 90%;
        }

        .btn-pink:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b34180;
        }

        .small-note {
            background: #ffe2f0;
            padding: 12px;
            border-radius: 40px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #a13e6f;
        }

        @media (max-width: 480px) {
            .card { padding: 18px 14px 25px; margin: 10px auto; }
            h1 { font-size: 1.8rem; }
            .name { font-size: 1.8rem; }
            .counter-number { font-size: 1.3rem; }
            .btn-pink { font-size: 1.2rem; padding: 12px 16px; }
        }

        .sparkle-pink {
            position: fixed;
            background: #ff99cc;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            opacity: 0.7;
            pointer-events: none;
            animation: twinkle 1s infinite alternate;
            z-index: 999;
        }

        @keyframes twinkle {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(2); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="balloon">🎀🎂🎀</div>
    <h1>🎉 عيد ميلاد 🎉</h1>
    <div class="name">يونس</div>

    <!-- العداد الحي -->
    <div class="counter-box">
        <div class="counter-item"><div class="counter-number" id="years">--</div><div class="counter-label">سنوات</div></div>
        <div class="counter-item"><div class="counter-number" id="days">--</div><div class="counter-label">أيام</div></div>
        <div class="counter-item"><div class="counter-number" id="hours">--</div><div class="counter-label">ساعات</div></div>
        <div class="counter-item"><div class="counter-number" id="minutes">--</div><div class="counter-label">دقائق</div></div>
        <div class="counter-item"><div class="counter-number" id="seconds">--</div><div class="counter-label">ثواني</div></div>
    </div>

    <div class="emoji-row">
        💖🌸🎈🩷🎀
    </div>

    <!-- الزر ثابت النص: إضغط للتالي -->
    <button class="btn-pink" id="nextBtn">📱 إضغط للتالي 📱</button>
    
    <div class="small-note">
        💕
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
<script>
    // تاريخ الميلاد: 19 يونيو 2011
    const birthDate = new Date(2011, 5, 19, 0, 0, 0);

    function updateCounter() {
        const now = new Date();
        let diffMs = now - birthDate;
        if (diffMs < 0) diffMs = 0;

        let years = now.getFullYear() - birthDate.getFullYear();
        let monthDiff = now.getMonth() - birthDate.getMonth();
        let dayDiff = now.getDate() - birthDate.getDate();
        if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) years--;

        let lastBirthday = new Date(birthDate);
        lastBirthday.setFullYear(now.getFullYear());
        if (now < lastBirthday) lastBirthday.setFullYear(now.getFullYear() - 1);
        let diffSinceLastBirth = now - lastBirthday;

        const days = Math.floor(diffSinceLastBirth / (1000 * 60 * 60 * 24));
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        document.getElementById('years').innerText = years;
        document.getElementById('days').innerText = days;
        document.getElementById('hours').innerText = hours;
        document.getElementById('minutes').innerText = minutes;
        document.getElementById('seconds').innerText = seconds;
    }
    updateCounter();
    setInterval(updateCounter, 1000);

    // تأثيرات وردية
    function launchPinkConfetti() {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#ff99cc', '#ffb7c5', '#ff6b9d', '#fbc4d2'] });
        setTimeout(() => confetti({ particleCount: 80, spread: 100, origin: { y: 0.5 }, colors: ['#ffb7c5', '#ff99cc'] }), 150);
        setTimeout(() => confetti({ particleCount: 100, spread: 70, origin: { y: 0.7, x: 0.3 }, colors: ['#ff6b9d'] }), 300);
    }

    function createPinkSparkles() {
        for (let i = 0; i < 50; i++) {
            let spark = document.createElement('div');
            spark.classList.add('sparkle-pink');
            spark.style.left = Math.random() * window.innerWidth + 'px';
            spark.style.top = Math.random() * window.innerHeight + 'px';
            spark.style.width = (Math.random() * 8 + 2) + 'px';
            spark.style.height = spark.style.width;
            document.body.appendChild(spark);
            setTimeout(() => { if (spark && spark.remove) spark.remove(); }, 4000);
        }
    }

    // رابط الملف memories.html (نفس المجلد)
    const nextBtn = document.getElementById('nextBtn');
    
    nextBtn.addEventListener('click', () => {
        // تأثيرات احتفالية قبل التحويل
        launchPinkConfetti();
        createPinkSparkles();
        
        // التحويل إلى ملف memories.html بعد نصف ثانية
        setTimeout(() => {
            window.location.href = "memories.html";
        }, 500);
    });

    // عند تحميل الصفحة
    window.addEventListener('load', () => {
        setTimeout(() => confetti({ particleCount: 80, spread: 60, origin: { y: 0.5 }, colors: ['#ff99cc', '#ffc0cb'] }), 200);
        createPinkSparkles();
    });
</script>
</body>
</html>
